[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-teller"
version = "0.1.0"
description = "Taiwan influenza forecasting with Google TimesFM 3.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyarrow", "matplotlib", "timesfm[mlx]>=3.0.2"]

[project.optional-dependencies]
baselines = ["statsforecast"]
torch = ["timesfm[torch]>=3.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
